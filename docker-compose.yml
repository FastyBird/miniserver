#
# FastyBird MiniServer - Development Docker Compose (convenience wrapper)
#
# This file includes the dev compose from docker/dev/.
# Compose reads the `.env` of the repository root for this file, and for the dev file it
# includes. Running docker/dev/docker-compose.yml directly reads docker/dev/.env instead:
# pass `--env-file .env` to use the root one (docs/deployment.md, "Development").
#

include:
  - docker/dev/docker-compose.yml
