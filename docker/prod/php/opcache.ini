[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=1255
;
; 128M is the ceiling on AArch64: above it PHP prints "JIT on AArch64 doesn't support
; opcache.jit_buffer_size above 128M" at every start (every CLI command and the fpm
; master) and leaves the JIT off, because a branch there reaches 128M at most. The same
; value is silent on x86-64, so one setting serves both architectures. Do not raise it.
opcache.jit_buffer_size=128M
opcache.interned_strings_buffer=16
