[PHP]
; The official php:*-fpm images ship no php.ini at all, so PHP falls back to its
; compiled-in defaults -- and display_errors is On there. Anything PHP prints
; before the application's own error handling takes over therefore lands in the
; HTTP response body, ahead of every header the application has not sent yet.
;
; PHP 8.4 made that visible: composer's eager autoload.files entries trip the
; implicitly-nullable-parameter deprecation in illuminate/support (see
; docs/deprecations.md), so two "Deprecated:" lines were written before
; Nette's DI container ran initialize(). headers_sent() was true by then, every
; header() call was a no-op, and GET / came back as PHP's own
; "Content-Type: text/html; charset=UTF-8" with no X-Powered-By: Nette
; Framework 3 -- which is what the production image smoke test caught.
;
; Tracy sets display_errors itself once the application has booted, so this only
; governs the window before that. Errors are not lost: log_errors sends them to
; php-fpm's error log, which supervisor captures.
display_errors=Off
display_startup_errors=Off
log_errors=On

memory_limit=256M
post_max_size=6M
upload_max_filesize=5M
realpath_cache_size=4096K
realpath_cache_ttl=600

[date]
date.timezone=${PHP_DATE_TIMEZONE}
