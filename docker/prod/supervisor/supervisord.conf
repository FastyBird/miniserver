; SUPERVISORD CONFIG

[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0700

[supervisord]
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /var/run/supervisord.pid
childlogdir = /var/log/supervisor
nodaemon = true
user = root

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; No [inet_http_server]: it would be an unauthenticated control port
; reachable from the network (0.0.0.0:9001, no credentials), letting anyone
; stop a program and have the watchdog turn that into a container kill.
; Nothing in this repository uses it -- supervisorctl talks over the unix
; socket above. If something genuinely needs the HTTP API, bind it to
; 127.0.0.1 and add credentials; do not reopen it on 0.0.0.0.

; No [include]: program definitions are intentionally baked into this file
; rather than read from a glob under the writable /app/var data volume.
; (A prior glob here, /app/var/config/supervisor/*.conf, matched nothing --
; this repository's supervisor configs live one level deeper, under
; plugins/, system/ and modules/ subdirectories -- so it was inert, but a
; correct glob would pick up a program definition that runs `yarn workspace
; ... dev`, which has no node/yarn in this production image and would go
; FATAL and take the container down, plus a duplicate websocket server on
; the same port.)

; APPLICATION PROGRAMS

[program:php-fpm]
command = php-fpm -F
user = root
autostart = true
autorestart = true

[program:nginx]
command = nginx -g "daemon off;"
user = root
autostart = true
autorestart = true

[program:ws-server]
command = php /app/bin/fb-console.php fb:ws-server:start
user = www-data
autostart = true
autorestart = true
redirect_stderr = true
stdout_logfile = /app/var/logs/ws-server.log

[program:exchange]
command = php /app/bin/fb-console.php fb:devices-module:exchange -n
user = www-data
autostart = true
autorestart = true
redirect_stderr = true
stdout_logfile = /app/var/logs/exchange.log

[eventlistener:subprocess-watcher]
command = php /app/bin/fb-supervisor.php
numprocs = 1
events = PROCESS_STATE_EXITED,PROCESS_STATE_STOPPED,PROCESS_STATE_FATAL
autostart = true
autorestart = unexpected
