#
# FastyBird MiniServer - Production Docker Compose
#
# Usage:
#   docker compose -f docker/prod/docker-compose.yml up -d
#
# With Redis (only useful once the RedisDb plugin is wired in local.neon):
#   docker compose -f docker/prod/docker-compose.yml --profile redis up -d
#
# NOTE: config still lives at var/config/ at this phase; Phase 3 moves it to
# config/ and switches FB_CONFIG_DIR to the /data layout.
#

services:
  application:
    # NOTE: this image is not yet published anywhere. The CI workflow builds
    # it (push: false) but does not log in or push; a later phase adds
    # publishing. Until then `docker compose pull` for this service will
    # fail — build locally instead (`docker compose -f
    # docker/prod/docker-compose.yml build`), which the `build:` block below
    # supports.
    image: ghcr.io/fastybird/miniserver:latest
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: miniserver
    restart: unless-stopped
    depends_on:
      - database
    environment:
      TZ: ${APP_TZ:-UTC}
      PHP_DATE_TIMEZONE: ${APP_TZ:-UTC}
      FB_APP_PARAMETER__DATABASE_HOST: database
      FB_APP_PARAMETER__DATABASE_PORT: 3306
      FB_APP_PARAMETER__DATABASE_USERNAME: ${DATABASE_USERNAME:-fastybird}
      FB_APP_PARAMETER__DATABASE_PASSWORD: ${DATABASE_PASSWORD:-fastybird}
      FB_APP_PARAMETER__DATABASE_DBNAME: ${DATABASE_DBNAME:-fastybird}
      FB_APP_PARAMETER__REDIS_HOST: redis
      FB_APP_PARAMETER__REDIS_PORT: 6379
      # Required, no default on purpose: this is the JWT signing key. The
      # repository's tracked .env / var/config/defaults.neon value is
      # published in a public repo and must never be used in production —
      # the entrypoint refuses to start rather than fall back to it. The
      # operator must supply SECURITY_SIGNATURE in the environment, e.g.
      # via a `docker/prod/.env` file: `openssl rand -base64 32`.
      FB_APP_PARAMETER__SECURITY_SIGNATURE: ${SECURITY_SIGNATURE}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${WS_PORT:-8888}:8888"
    volumes:
      - miniserver-var:/app/var
    healthcheck:
      # "/" is not routed (see docker/prod/Dockerfile HEALTHCHECK comment
      # and spec section 7.1); /favicon.ico is served by nginx and returns
      # 200.
      test: ["CMD", "curl", "-f", "http://localhost/favicon.ico"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  database:
    image: mariadb:10.11
    container_name: miniserver-database
    restart: unless-stopped
    environment:
      TZ: ${APP_TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:-root}
      MYSQL_USER: ${DATABASE_USERNAME:-fastybird}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-fastybird}
      MYSQL_DATABASE: ${DATABASE_DBNAME:-fastybird}
    volumes:
      - miniserver-database:/var/lib/mysql

  redis:
    image: redis:7
    container_name: miniserver-redis
    restart: unless-stopped
    profiles:
      - redis
    volumes:
      - miniserver-redis:/data

volumes:
  miniserver-var:
  miniserver-database:
  miniserver-redis:
