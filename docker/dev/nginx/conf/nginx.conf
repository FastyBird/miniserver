user www-data;
worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens   off;

    client_max_body_size    64m;
    sendfile                on;
    tcp_nodelay             on;
    tcp_nopush              on;

    gzip_vary   on;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    send_timeout            600s;
    proxy_connect_timeout   600s;
    proxy_send_timeout      600s;
    proxy_read_timeout      600s;
    fastcgi_send_timeout    600s;
    fastcgi_read_timeout    600s;

    server {
        listen 80;

        server_name fastybird_docker;

        root /app/public;
        index index.php;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Docker's embedded DNS. Resolving the upstream per request (a variable in
        # fastcgi_pass makes nginx do that) rather than once at startup means a
        # recreated `application` container, which gets a new address, is picked up
        # without restarting this one. Without it every request answers 502 until then.
        resolver 127.0.0.11 valid=5s ipv6=off;

        location ~ \.php$ {
            include fastcgi_params;

            set $php_upstream application:9000;

            fastcgi_pass   $php_upstream;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT $realpath_root;

            fastcgi_split_path_info ^(.+\.php)(/.*)$;
        }
    }
}
