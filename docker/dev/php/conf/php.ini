[PHP]
; The same three values as docker/prod/php/php.ini, for the same reason. The
; php:*-fpm base image ships no php.ini, so display_errors defaults to On. PHP
; 8.4 deprecations from vendor code (see docs/deprecations.md) are then printed
; while composer's autoloader runs, before any header is sent, and every HTTP
; request answers with a "headers already sent" Tracy page and status 200
; instead of its real response.
;
; Tracy sets display_errors itself once the application has booted, so this only
; governs the window before that. Errors are not lost: log_errors sends them to
; the container's stderr.
display_errors=Off
display_startup_errors=Off
log_errors=On

memory_limit=512M

[date]
date.timezone=${PHP_DATE_TIMEZONE}

[xdebug]
xdebug.mode=develop,debug
xdebug.client_host=host.docker.internal
xdebug.start_with_request=trigger
xdebug.client_port=9000
xdebug.discover_client_host=true
xdebug.idekey=${PHP_XDEBUG_IDEKEY}

[opcache]
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
;opcache.preload=/app/config/preload.php
opcache.preload_user=www-data
opcache.jit=1255
opcache.jit_buffer_size=256M
