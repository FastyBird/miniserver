; Loaded only by the test targets in the Makefile, through PHP_INI_SCAN_DIR, so
; that both the runner and the child processes PHPUnit spawns for
; @runTestsInSeparateProcesses pick it up. A phpunit.xml <php><ini> entry cannot
; do this job: it is applied after composer's autoloader has already run.
;
; PHP 8.4 deprecates implicitly nullable parameters. Vendor code trips it 258
; times while composer's eager autoload.files entries are loaded
; (thecodingmachine/safe through infection, illuminate/* through mathsolver) --
; see docs/deprecations.md. The printing is what breaks the suite, not the
; deprecations: PHPUnit's process-isolation template sets display_errors=stderr,
; and AbstractPhpProcess::processChildResult() errors any isolated test whose
; child process wrote a single byte to stderr. On PHP 8.2 no such deprecation
; existed and the suite was green; on 8.4 it took out 1167 of 1407 tests, all of
; them the ones carrying @runTestsInSeparateProcesses.
;
; This hides nothing from the report. PHP calls a registered error handler
; regardless of error_reporting, so PHPUnit still counts and displays every
; deprecation in its own summary.
;
; Drop this file once the deprecations are gone: the Infection upgrade that PHP
; 8.2 was blocking retires 256 of them, leaving the two from illuminate/*.
error_reporting = E_ALL & ~E_DEPRECATED
