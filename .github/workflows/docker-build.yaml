name: "Docker build"

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - "main"
  # No `tags: v*` trigger: this workflow never logs in or pushes
  # (build-push-action runs with push: false), so tagging a release would
  # spend ~8 minutes and publish nothing. A later phase adds registry login
  # and push, at which point a tag trigger can come back.
  schedule:
    - cron: "0 8 * * 1" # At 08:00 on Monday

jobs:
  build-and-smoke-test:
    name: "Build production image and run smoke test"
    runs-on: "ubuntu-latest"

    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: fastybird
          MYSQL_PASSWORD: fastybird
          MYSQL_DATABASE: fastybird_dev
        ports:
          - "3306:3306"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Build production image"
        uses: "docker/build-push-action@v7"
        with:
          context: .
          file: docker/prod/Dockerfile
          push: false
          load: true
          tags: fastybird/miniserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Check platform requirements against the runtime image"
        run: docker run --rm --entrypoint composer fastybird/miniserver:ci check-platform-reqs

      - name: "Start production container"
        run: |
          docker run -d --name miniserver \
            --network host \
            -e FB_APP_PARAMETER__DATABASE_HOST=127.0.0.1 \
            -e FB_APP_PARAMETER__DATABASE_PORT=3306 \
            -e FB_APP_PARAMETER__DATABASE_USERNAME=fastybird \
            -e FB_APP_PARAMETER__DATABASE_PASSWORD=fastybird \
            -e FB_APP_PARAMETER__DATABASE_DBNAME=fastybird_dev \
            -e FB_APP_PARAMETER__SECURITY_SIGNATURE=ci-smoke-test-signature-not-for-production \
            fastybird/miniserver:ci

      - name: "Wait for HTTP 200 on GET /favicon.ico (nginx serving public/)"
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:80/favicon.ico || echo 000)
            if [ "$code" = "200" ]; then
              echo "Got HTTP 200 on /favicon.ico"
              exit 0
            fi
            echo "Waiting for the application (last status: $code)..."
            sleep 5
          done
          echo "Application did not become ready in time"
          docker logs miniserver
          exit 1

      # GET / is not asserted to return 200. AppRouter::createRouter
      # (Core/Application/src/Router/AppRouter.php) defines a route for "/",
      # but nothing registers it: there is no `services: router:` entry and
      # no `application: mapping:` in any config (checked both
      # Core/Application/config/*.neon and config/*.neon; `git log
      # -S'AppRouter'` over those paths returns nothing). The Nette
      # application therefore has no routes and correctly 404s every
      # non-API request. This is pre-existing frozen-repository behaviour,
      # not something this phase introduced, and wiring the router would be
      # a behavioural change the merge forbids. Do not "fix" this assertion
      # to expect 200 — it cannot happen without a router config change
      # that is out of scope here. What we can and do assert is that the
      # request reached and was handled by the Nette app.
      - name: "GET / is handled by the Nette application (any status)"
        run: |
          headers=$(curl -s -D - -o /dev/null http://127.0.0.1:80/)
          echo "$headers"
          echo "$headers" | grep -qi "^X-Powered-By: Nette Framework 3" \
            || { echo "Missing X-Powered-By: Nette Framework 3 header"; exit 1; }

      - name: "GET /api/v1 dispatches to the API stack (any status)"
        run: |
          headers=$(curl -s -D - -o /dev/null http://127.0.0.1:80/api/v1)
          echo "$headers"
          echo "$headers" | grep -qi "^Content-Type: application/vnd.api+json" \
            || { echo "Missing Content-Type: application/vnd.api+json header"; exit 1; }

      - name: "Run bin/fb-console.php list inside the container"
        run: docker exec miniserver php bin/fb-console.php list

      - name: "All five supervisor programs are RUNNING"
        run: |
          status=$(docker exec miniserver supervisorctl -c /etc/supervisor/supervisord.conf status)
          echo "$status"
          count=$(echo "$status" | grep -c "RUNNING")
          if [ "$count" != "5" ]; then
            echo "Expected 5 RUNNING programs, got $count"
            exit 1
          fi

      - name: "Exception log is empty or absent"
        run: docker exec miniserver sh -c '[ ! -s /data/logs/exception.log ]'

      - name: "Dump container logs on failure"
        if: failure()
        run: docker logs miniserver
