name: "Release"

on:
  release:
    types: [ "published" ]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: "Build and push production image"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Log in to GHCR"
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      # "latest" must not follow a pre-release. GitHub fires this workflow for
      # every published release, pre-release included, so tagging latest
      # unconditionally would point the tag operators pull by default at a beta
      # the moment one is published. The version tag is always applied; latest is
      # applied only for a full release.
      - name: "Compute image tags"
        id: "tags"
        env:
          TAG_NAME: "${{ github.event.release.tag_name }}"
          IS_PRERELEASE: "${{ github.event.release.prerelease }}"
        run: |
          {
            echo "value<<EOF"
            echo "ghcr.io/fastybird/miniserver:${TAG_NAME}"
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "ghcr.io/fastybird/miniserver:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE"

      - name: "Build and push"
        uses: "docker/build-push-action@v7"
        with:
          context: "."
          file: "docker/prod/Dockerfile"
          push: true
          tags: "${{ steps.tags.outputs.value }}"
